[server]
ip_groundstation_server = http://127.0.0.1:8000/

[internal-protocol]
position_command = 102

[serial]
port = COM4
baudrate = 115200
serial_available = false

[post]
path_receive_info = update-info/

[list-updater]
seconds_to_device_be_inactive = 50
seconds_to_device_be_on_hold = 25
update_delay = 20

[commands-list]
20 = telemetry/gps,get
22 = telemetry/ned,get
24 = command/arm,get
26 = command/takeoff,get
28 = command/land,get
30 = command/rtl,get
42 = mission/list-scripts,get
44 = mission/upload-script,post
46 = mission/execute-script/,post
48 = mission/running-scripts,get
50 = mission/stop-script/,post

[checkbox-commands]
keep_sending = 28,30
stop_sending = 29,31

[uav-simulator]
uav_quantity = 1
ip_uav_server = http://127.0.0.1:8000/

[embedded]
; A estação fala com o control API do embedded, que vive no MESMO host do
; vehicle_api (o embedded chama o vehicle_api em localhost) mas noutra porta. O
; host vem do 'ip' que o drone mandou na telemetria; só as portas são
; configuradas aqui.
;
; Os nomes são os do embedded.toml provisionado pelo fleet
; (fleet/roles/gradys_embedded/templates/embedded.toml.j2) — control_api_port e
; data_port. Se mudar lá, muda aqui.
control_api_port = 6000
; Porta do data plane entre drones. Entra no node_ip_dict como "host:port" CRU,
; sem esquema — o embedded recusa "http://…" ali.
data_port = 5000
; 0 = porta fixa em todo drone. É o caso de campo (cada drone é uma Pi com seu
; IP) E o do SITL do fleet (cada drone é um contêiner com seu IP). Só mexa nisso
; se rodar vários embeddeds num host só, fora do fleet.
port_step = 0
